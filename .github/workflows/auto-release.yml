name: Auto release

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.repository }}-metalink-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.TAG_PUSH_PAT }}

      - name: Verify tag push credential
        env:
          TAG_PUSH_PAT: ${{ secrets.TAG_PUSH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TAG_PUSH_PAT" ]]; then
            echo 'TAG_PUSH_PAT is required so a pushed tag can trigger publishing.'
            exit 1
          fi

      - name: Decide whether the version needs a release
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo 'Branch creation detected; no release tag will be created.'
            exit 0
          fi

          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d "\"'")
          if [[ -z "$version" ]]; then
            echo 'Unable to read version from pubspec.yaml.'
            exit 1
          fi

          stable_pattern='^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$'
          prerelease_pattern='^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+(\+[0-9A-Za-z.-]+)?$'
          if [[ "$GITHUB_REF_NAME" == 'main' && ! "$version" =~ $stable_pattern ]]; then
            echo "main requires a stable semantic version, got $version."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == 'dev' && ! "$version" =~ $prerelease_pattern ]]; then
            echo "dev requires a prerelease semantic version, got $version."
            exit 1
          fi

          # Release whenever the version on this lane has no tag yet, instead of
          # comparing with the previous push. GitHub cancels a pending run when
          # a newer push queues, so a before/after comparison could silently
          # skip a version bump. An existing tag is never moved or recreated.
          tag="metalink-v$version"
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Version $version is already tagged; no new tag will be created."
            echo 'create_tag=false' >> "$GITHUB_OUTPUT"
          else
            echo 'create_tag=true' >> "$GITHUB_OUTPUT"
          fi
          {
            echo "value=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.version.outputs.create_tag == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      # Runs for an existing tag too, so a release whose tag was pushed but
      # whose GitHub release was never created is completed by the next push.
      - name: Create GitHub release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists."
            exit 0
          fi
          target=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          args=("$RELEASE_TAG" --verify-tag --generate-notes --target "$target")
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
