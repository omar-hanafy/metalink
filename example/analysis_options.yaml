# example/analysis_options.yaml - relaxed override for a package's example app.
# Examples are documentation: they print, they skip API docs, they stay simple.
# Disabling a rule the root never enabled is a harmless no-op.

include: ../analysis_options.yaml

linter:
  rules:
    public_member_api_docs: false
    comment_references: false
    avoid_print: false
    prefer_asserts_with_message: false
    diagnostic_describe_all_properties: false
